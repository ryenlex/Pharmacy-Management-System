{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login-box">
  <h2>Sign in</h2>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="{{ 'notice' if category == 'success' else 'error' }}">{{ message }}</p>
  {% endfor %}
  <form method="post">
    <label>Login as</label>
    <div class="role-pick">
     <label><input type="radio" name="role" value="admin" checked> Admin</label>
     <label><input type="radio" name="role" value="member"> Member</label>
    </div>
    <label for="username">User ID</label>
    <input id="username" name="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="alt">New member? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
